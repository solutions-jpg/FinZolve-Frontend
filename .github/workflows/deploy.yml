name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll

      - name: Publish build to repository root (fixes Pages main / root)
        run: |
          cp dist/index.html index.html
          rm -rf assets
          cp -r dist/assets assets
          cp dist/favicon.svg favicon.svg 2>/dev/null || true
          cp dist/robots.txt robots.txt 2>/dev/null || true
          cp dist/sitemap.xml sitemap.xml 2>/dev/null || true
          cp dist/CNAME CNAME 2>/dev/null || true
          cp dist/.nojekyll .nojekyll 2>/dev/null || true

      - name: Publish to docs/ (if Pages uses main /docs)
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r dist/* docs/
          cp dist/.nojekyll docs/.nojekyll

      - name: Commit production files on main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Deploy production build to site root and docs'
          file_pattern: 'index.html assets/** docs/** favicon.svg robots.txt sitemap.xml CNAME .nojekyll'
          branch: main

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy production build'
