name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build production site
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Copy build into docs/ (for Pages: main branch, /docs folder)
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r dist/* docs/
          cp dist/.nojekyll docs/.nojekyll

      - name: Commit docs/ to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Deploy production site to docs folder'
          file_pattern: 'docs/**'
          branch: main

      - name: Publish same build to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy production build'
